name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobportal_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d jobportal_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      seaweed:
        image: chrislusf/seaweedfs:3.80
        command: server -dir=/data -master -volume -filer -s3 -s3.port=9000 -s3.allowedOrigins=http://localhost:3000
        ports: ["9000:9000", "9333:9333"]
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:9333/cluster/status"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Apply database migrations and seed demo records
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobportal_db?schema=public
          SEED_PASSWORD: JobPortal123!
          S3_BUCKET_NAME: jobportal-uploads
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          S3_ENDPOINT: http://localhost:9000
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run db:seed
      - name: Backend checks
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobportal_db?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci-access-secret-012345678901234567890123456789
          JWT_REFRESH_SECRET: ci-refresh-secret-012345678901234567890123456789
          S3_BUCKET_NAME: jobportal-uploads
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          S3_ENDPOINT: http://localhost:9000
        run: |
          npm run typecheck
          npm run build
          npm test
          npm run test:integration
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend checks
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
        run: |
          npm run typecheck
          npm run build

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start complete application stack
        run: |
          cp .env.example .env
          docker compose up --build -d
      - name: Seed demo accounts and listings
        run: docker compose exec -T api_backend npm run db:seed
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run candidate-to-recruiter browser flow
        working-directory: frontend
        env:
          SEED_PASSWORD: JobPortal123!
        run: npm run test:e2e
      - name: Collect service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop application stack
        if: always()
        run: docker compose down -v
