services:
  postgres_db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobportal_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobportal_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis_cache:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  object_storage:
    image: docker.io/chrislusf/seaweedfs:3.80
    command: ["server", "-dir=/data", "-master", "-volume", "-filer", "-s3", "-s3.port=9000", "-s3.allowedOrigins=${FRONTEND_URL:-http://localhost:3000}"]
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
    volumes:
      - object_storage_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://$$(hostname -i):9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 20

  api_backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres_db:5432/${POSTGRES_DB:-jobportal_db}?schema=public
      REDIS_URL: redis://redis_cache:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-jobportal-uploads}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      S3_ENDPOINT: http://object_storage:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@jobportal.com}
      SEED_PASSWORD: ${SEED_PASSWORD:-JobPortal123!}
    ports:
      - "5000:5000"
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
      object_storage:
        condition: service_healthy
    command: ["sh", "-c", "npm run db:deploy && npm start"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  email_worker:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_URL: redis://redis_cache:6379
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@jobportal.com}
    command: ["npm", "run", "worker"]
    depends_on:
      api_backend:
        condition: service_healthy
      redis_cache:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api/v1}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api_backend:5000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api_backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  object_storage_data:
